name: les-condeza

x-app: &app
  build: ./app
  env_file: .env
  environment:
    TZ: America/Sao_Paulo
    DATABASE_URL: mysql+pymysql://condeza:${MYSQL_PASSWORD}@mysql:3306/condeza
    ERP_URL: http://erp-simulado:8000
    APP_URL: http://app-simulado:8000
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODELO: qwen3.5:4b-q4_K_M
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    URL_PUBLICA: http://127.0.0.1:5080
    PASTA_DOCUMENTOS: /dados/documentos
  volumes:
    - ./app:/app
    - documentos:/dados/documentos
  networks: [default, ia]
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    command: flask --app sistema run --host 0.0.0.0 --port 8000 --debug
    ports:
      - "127.0.0.1:5080:8000"

  worker:
    <<: *app
    command: python -m sistema.worker

  mysql:
    image: mysql:8.4
    environment:
      TZ: America/Sao_Paulo
      MYSQL_DATABASE: condeza
      MYSQL_USER: condeza
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20

  ollama:
    image: ollama/ollama@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    cpus: 4
    mem_limit: 7g
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-modelos:/root/.ollama
    networks: [ia]

  erp-simulado:
    build: ./simulados
    command: python erp/app.py
    environment:
      TZ: America/Sao_Paulo
      API_CHAVE: ${ERP_API_CHAVE}
    volumes:
      - ./simulados:/srv
    ports:
      - "127.0.0.1:5081:8000"

  app-simulado:
    build: ./simulados
    command: python aplicativo/app.py
    environment:
      TZ: America/Sao_Paulo
      API_CHAVE: ${APP_API_CHAVE}
      CONDOMINO_TESTE_SENHA: ${CONDOMINO_TESTE_SENHA}
    volumes:
      - ./simulados:/srv
    ports:
      - "127.0.0.1:5082:8000"

  mailpit:
    image: axllent/mailpit@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    ports:
      - "127.0.0.1:8036:8025"

networks:
  default: {}
  ia:
    internal: true

volumes:
  mysql:
  documentos:
  ollama-modelos:
    external: true
    name: ia-teste_ollama-modelos
